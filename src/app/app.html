<div class="app-layout">

  <aside class="sidebar" aria-label="Main navigation">
    <a class="brand" routerLink="/">
      <span class="brand-icon">C</span>
      <span>ChangeOps</span>
    </a>

    <div class="sidebar-section">WORKSPACE</div>

    <nav class="navigation" aria-label="Workspace">
      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>

      <a routerLink="/changes"
         routerLinkActive="active">
        Changes
      </a>

      <a routerLink="/approvals"
         routerLinkActive="active">
        Approvals
      </a>

      <a routerLink="/audit"
         routerLinkActive="active">
        Audit Log
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="demo-indicator"></span>
      Demo Environment
    </div>
  </aside>

  <div class="main-area">

    <header class="topbar">
      <div class="topbar-info">
        <span class="workspace-label">IT Change Management</span>
        <span class="workspace-subtitle">Operations Workspace</span>
      </div>

      <a class="primary-button" routerLink="/changes/new">
        + New Change
      </a>
    </header>

    <main class="page-content" id="main-content">
      <router-outlet />
    </main>

  </div>
</div>
